<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Company Snapshot</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0e17;
        --surface: #111827;
        --surface2: #1a2235;
        --border: #1f2d45;
        --accent: #00d4ff;
        --green: #10b981;
        --red: #ef4444;
        --yellow: #f59e0b;
        --text: #e2e8f0;
        --text-dim: #64748b;
        --text-muted: #334155;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "IBM Plex Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      .page-content {
        max-width: 1400px;
        margin: 0 auto;
        padding: 32px 24px;
      }
      h1 {
        font-size: 32px;
        font-weight: 300;
        letter-spacing: -0.02em;
        margin-bottom: 4px;
      }
      h1 span {
        color: var(--accent);
        font-weight: 600;
      }
      .subtitle {
        color: var(--text-dim);
        font-size: 14px;
        margin-bottom: 32px;
        font-family: "IBM Plex Mono", monospace;
      }

      .search-box {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 28px;
      }
      .search-box h3 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-dim);
        font-family: "IBM Plex Mono", monospace;
        margin-bottom: 14px;
      }
      .search-row {
        display: flex;
        gap: 12px;
        align-items: flex-end;
        flex-wrap: wrap;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .field label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-dim);
        font-family: "IBM Plex Mono", monospace;
      }
      .field input {
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 10px 14px;
        border-radius: 6px;
        font-size: 14px;
        width: 220px;
        transition: border-color 0.2s;
      }
      .field input:focus {
        outline: none;
        border-color: var(--accent);
      }
      .field input::placeholder {
        color: var(--text-muted);
      }
      .btn-search {
        background: var(--accent);
        color: #000;
        border: none;
        padding: 10px 24px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        font-family: "IBM Plex Mono", monospace;
        transition: opacity 0.2s;
      }
      .btn-search:hover {
        opacity: 0.85;
      }
      .btn-search:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .company-header {
        display: none;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 20px 24px;
        margin-bottom: 28px;
      }
      .company-header.visible {
        display: flex;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
      }
      .ch-logo {
        width: 48px;
        height: 48px;
        border-radius: 8px;
        object-fit: contain;
        background: var(--surface2);
        padding: 4px;
        display: none;
      }
      .ch-logo.visible {
        display: block;
      }
      .ch-info {
        flex: 1;
      }
      .ch-name {
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .ch-ticker {
        font-family: "IBM Plex Mono", monospace;
        color: var(--accent);
        font-size: 14px;
      }
      .ch-meta {
        color: var(--text-dim);
        font-size: 13px;
        margin-top: 2px;
      }
      .ch-price {
        text-align: right;
      }
      .ch-price-val {
        font-size: 28px;
        font-weight: 600;
        font-family: "IBM Plex Mono", monospace;
      }
      .ch-price-change {
        font-size: 13px;
        font-family: "IBM Plex Mono", monospace;
        margin-top: 2px;
      }
      .ch-price-change.pos {
        color: var(--green);
      }
      .ch-price-change.neg {
        color: var(--red);
      }

      .status-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 24px;
        font-size: 13px;
        color: var(--text-dim);
        font-family: "IBM Plex Mono", monospace;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--text-muted);
      }
      .dot.loading {
        background: var(--accent);
        animation: pulse 1s infinite;
      }
      .dot.ready {
        background: var(--green);
      }
      .dot.error {
        background: var(--red);
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      .snapshot-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 20px;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      .card-header {
        background: var(--surface2);
        padding: 12px 16px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-dim);
        font-family: "IBM Plex Mono", monospace;
        border-bottom: 1px solid var(--border);
      }
      .card-body {
        padding: 0;
      }

      .metric-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
      }
      .metric-row:last-child {
        border-bottom: none;
      }
      .metric-row:hover {
        background: var(--surface2);
      }
      .metric-label {
        font-size: 13px;
        color: var(--text-dim);
      }
      .metric-value {
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
      }
      .metric-value.pos {
        color: var(--green);
      }
      .metric-value.neg {
        color: var(--red);
      }
      .metric-value.neutral {
        color: var(--text-dim);
      }

      .bar-row {
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
      }
      .bar-row:last-child {
        border-bottom: none;
      }
      .bar-row:hover {
        background: var(--surface2);
      }
      .bar-top {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
      }
      .bar-label {
        font-size: 13px;
        color: var(--text-dim);
      }
      .bar-val {
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        font-weight: 600;
      }
      .bar-track {
        height: 4px;
        background: var(--border);
        border-radius: 2px;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        border-radius: 2px;
        transition: width 0.6s ease;
      }
      .bar-fill.green {
        background: var(--green);
      }
      .bar-fill.yellow {
        background: var(--yellow);
      }
      .bar-fill.red {
        background: var(--red);
      }
      .bar-fill.blue {
        background: var(--accent);
      }

      .empty-state {
        padding: 60px;
        text-align: center;
        color: var(--text-muted);
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <script src="/navbar.js"></script>
    <div class="page-content">
      <h1>Company <span>Snapshot</span></h1>
      <p class="subtitle">
        // ratios e metriche chiave · fonte: Finnhub · piano gratuito
      </p>

      <div class="search-box">
        <h3>// Cerca azienda</h3>
        <div class="search-row">
          <div class="field">
            <label>Ticker</label>
            <input
              type="text"
              id="input-ticker"
              placeholder="es. AAPL, MSFT, NVDA..."
            />
          </div>
          <button
            class="btn-search"
            id="btn-search"
            onclick="caricaSnapshot()"
          >
            CARICA
          </button>
        </div>
      </div>

      <div
        class="company-header"
        id="company-header"
      >
        <img
          id="ch-logo"
          class="ch-logo"
        />
        <div class="ch-info">
          <div
            class="ch-name"
            id="ch-name"
          ></div>
          <div>
            <span
              class="ch-ticker"
              id="ch-ticker"
            ></span>
            <span
              class="ch-meta"
              id="ch-meta"
            ></span>
          </div>
        </div>
        <div class="ch-price">
          <div
            class="ch-price-val"
            id="ch-price"
          ></div>
          <div
            class="ch-price-change"
            id="ch-change"
          ></div>
        </div>
      </div>

      <div class="status-bar">
        <div
          class="dot"
          id="status-dot"
        ></div>
        <span id="status-text">Inserisci un ticker e clicca CARICA</span>
      </div>

      <div id="snapshot-container"></div>
    </div>

    <script>
      document
        .getElementById("input-ticker")
        .addEventListener("keydown", (e) => {
          if (e.key === "Enter") caricaSnapshot();
        });

      async function caricaSnapshot() {
        const ticker = document
          .getElementById("input-ticker")
          .value.trim()
          .toUpperCase();
        if (!ticker) return;

        setStatus("loading", `Caricamento dati per ${ticker}...`);
        document.getElementById("btn-search").disabled = true;
        document.getElementById("company-header").className = "company-header";
        document.getElementById("snapshot-container").innerHTML = "";

        try {
          const [metricRes, profileRes, quoteRes] = await Promise.all([
            fetch(`/api/finnhub/metric/${ticker}`),
            fetch(`/api/finnhub/profile/${ticker}`),
            fetch(`/api/finnhub/quote/${ticker}`),
          ]);

          const [metricData, profile, quote] = await Promise.all([
            metricRes.json(),
            profileRes.json(),
            quoteRes.json(),
          ]);

          const m = metricData.metric || {};

          if (!m.beta && !m.marketCapitalization) {
            setStatus("error", `Nessun dato trovato per ${ticker}`);
            document.getElementById("btn-search").disabled = false;
            return;
          }

          // Header azienda
          document.getElementById("ch-name").textContent =
            profile.name || ticker;
          document.getElementById("ch-ticker").textContent = ticker;
          document.getElementById("ch-meta").textContent =
            profile.finnhubIndustry
              ? ` · ${profile.finnhubIndustry} · ${profile.country || ""}`
              : "";

          if (profile.logo) {
            const logo = document.getElementById("ch-logo");
            logo.src = profile.logo;
            logo.className = "ch-logo visible";
          }

          if (quote.c) {
            document.getElementById("ch-price").textContent =
              `$${quote.c.toFixed(2)}`;
            const change = quote.dp;
            const changeEl = document.getElementById("ch-change");
            changeEl.textContent = `${change >= 0 ? "▲" : "▼"} ${Math.abs(change).toFixed(2)}% oggi`;
            changeEl.className = `ch-price-change ${change >= 0 ? "pos" : "neg"}`;
          }

          document.getElementById("company-header").className =
            "company-header visible";

          renderSnapshot(m, profile);
          setStatus("ready", `Dati aggiornati · fonte: Finnhub`);
        } catch (err) {
          setStatus("error", "Errore: " + err.message);
        }

        document.getElementById("btn-search").disabled = false;
      }

      function renderSnapshot(m, profile) {
        const container = document.getElementById("snapshot-container");

        const sezioni = [
          {
            titolo: "// Valutazione",
            tipo: "metric",
            righe: [
              {
                label: "Market Cap",
                value: formatBig(
                  m.marketCapitalization ? m.marketCapitalization * 1e6 : null,
                ),
              },
              {
                label: "Enterprise Value",
                value: formatBig(
                  m.enterpriseValue ? m.enterpriseValue * 1e6 : null,
                ),
              },
              {
                label: "P/E (Annual)",
                value: fmtVal(m.peAnnual),
                color: ratingPE(m.peAnnual),
              },
              {
                label: "P/E (TTM)",
                value: fmtVal(m.peTTM),
                color: ratingPE(m.peTTM),
              },
              {
                label: "Forward P/E",
                value: fmtVal(m.forwardPE),
                color: ratingPE(m.forwardPE),
              },
              { label: "P/S (Annual)", value: fmtVal(m.psAnnual) },
              { label: "P/B (Annual)", value: fmtVal(m.pbAnnual) },
              { label: "EV/EBITDA (TTM)", value: fmtVal(m.evEbitdaTTM) },
              { label: "EV/Revenue (TTM)", value: fmtVal(m.evRevenueTTM) },
              { label: "PEG (TTM)", value: fmtVal(m.pegTTM) },
            ],
          },
          {
            titolo: "// Crescita",
            tipo: "metric",
            righe: [
              {
                label: "Revenue Growth YoY (TTM)",
                value: fmtPct(m.revenueGrowthTTMYoy),
                color: ratingGrowth(m.revenueGrowthTTMYoy),
              },
              {
                label: "Revenue Growth 3Y",
                value: fmtPct(m.revenueGrowth3Y),
                color: ratingGrowth(m.revenueGrowth3Y),
              },
              {
                label: "Revenue Growth 5Y",
                value: fmtPct(m.revenueGrowth5Y),
                color: ratingGrowth(m.revenueGrowth5Y),
              },
              {
                label: "EPS Growth YoY (TTM)",
                value: fmtPct(m.epsGrowthTTMYoy),
                color: ratingGrowth(m.epsGrowthTTMYoy),
              },
              {
                label: "EPS Growth 3Y",
                value: fmtPct(m.epsGrowth3Y),
                color: ratingGrowth(m.epsGrowth3Y),
              },
              {
                label: "EPS Growth 5Y",
                value: fmtPct(m.epsGrowth5Y),
                color: ratingGrowth(m.epsGrowth5Y),
              },
              {
                label: "EBITDA CAGR 5Y",
                value: fmtPct(m.ebitdaCagr5Y),
                color: ratingGrowth(m.ebitdaCagr5Y),
              },
              {
                label: "FCF CAGR 5Y",
                value: fmtPct(m.focfCagr5Y),
                color: ratingGrowth(m.focfCagr5Y),
              },
              {
                label: "Book Value Growth 5Y",
                value: fmtPct(m.bookValueShareGrowth5Y),
                color: ratingGrowth(m.bookValueShareGrowth5Y),
              },
            ],
          },
          {
            titolo: "// Redditività",
            tipo: "bar",
            righe: [
              {
                label: "Gross Margin (Annual)",
                value: m.grossMarginAnnual,
                color: ratingMargin(m.grossMarginAnnual),
              },
              {
                label: "Gross Margin (TTM)",
                value: m.grossMarginTTM,
                color: ratingMargin(m.grossMarginTTM),
              },
              {
                label: "Operating Margin (Annual)",
                value: m.operatingMarginAnnual,
                color: ratingMargin(m.operatingMarginAnnual),
              },
              {
                label: "Net Profit Margin (Annual)",
                value: m.netProfitMarginAnnual,
                color: ratingMargin(m.netProfitMarginAnnual),
              },
              {
                label: "Net Profit Margin (TTM)",
                value: m.netProfitMarginTTM,
                color: ratingMargin(m.netProfitMarginTTM),
              },
              {
                label: "Pretax Margin (Annual)",
                value: m.pretaxMarginAnnual,
                color: ratingMargin(m.pretaxMarginAnnual),
              },
              {
                label: "ROE (TTM)",
                value: m.roeTTM,
                color: ratingROE(m.roeTTM),
              },
              {
                label: "ROA (TTM)",
                value: m.roaTTM,
                color: ratingMargin(m.roaTTM),
              },
              {
                label: "ROI (Annual)",
                value: m.roiAnnual,
                color: ratingMargin(m.roiAnnual),
              },
            ],
          },
          {
            titolo: "// Solidità finanziaria",
            tipo: "metric",
            righe: [
              {
                label: "Current Ratio (Annual)",
                value: fmtVal(m.currentRatioAnnual),
                color: ratingLiquidity(m.currentRatioAnnual),
              },
              {
                label: "Quick Ratio (Annual)",
                value: fmtVal(m.quickRatioAnnual),
                color: ratingLiquidity(m.quickRatioAnnual),
              },
              {
                label: "Debt/Equity (Annual)",
                value: fmtVal(
                  m.totalDebt_totalEquityAnnual ||
                    m["totalDebt/totalEquityAnnual"],
                ),
                color: ratingDebt(
                  m.totalDebt_totalEquityAnnual ||
                    m["totalDebt/totalEquityAnnual"],
                ),
              },
              {
                label: "LT Debt/Equity (Annual)",
                value: fmtVal(
                  m.longTermDebt_equityAnnual || m["longTermDebt/equityAnnual"],
                ),
              },
              {
                label: "Net Interest Coverage (Annual)",
                value: fmtVal(m.netInterestCoverageAnnual),
              },
              {
                label: "Asset Turnover (Annual)",
                value: fmtVal(m.assetTurnoverAnnual),
              },
              {
                label: "Inventory Turnover (Annual)",
                value: fmtVal(m.inventoryTurnoverAnnual),
              },
              {
                label: "Receivables Turnover (Annual)",
                value: fmtVal(m.receivablesTurnoverAnnual),
              },
            ],
          },
          {
            titolo: "// Per azione",
            tipo: "metric",
            righe: [
              { label: "EPS (Annual)", value: fmtVal(m.epsAnnual) },
              { label: "EPS (TTM)", value: fmtVal(m.epsTTM) },
              {
                label: "Revenue/Share (Annual)",
                value: fmtVal(m.revenuePerShareAnnual),
              },
              {
                label: "Book Value/Share (Annual)",
                value: fmtVal(m.bookValuePerShareAnnual),
              },
              {
                label: "Cash Flow/Share (Annual)",
                value: fmtVal(m.cashFlowPerShareAnnual),
              },
              {
                label: "Cash/Share (Annual)",
                value: fmtVal(m.cashPerSharePerShareAnnual),
              },
              {
                label: "Dividend/Share (Annual)",
                value: fmtVal(m.dividendPerShareAnnual),
              },
              {
                label: "Dividend Yield (TTM)",
                value: fmtPct(m.currentDividendYieldTTM),
              },
            ],
          },
          {
            titolo: "// Performance prezzo",
            tipo: "metric",
            righe: [
              {
                label: "52W High",
                value: m["52WeekHigh"] ? `$${m["52WeekHigh"].toFixed(2)}` : "—",
              },
              {
                label: "52W Low",
                value: m["52WeekLow"] ? `$${m["52WeekLow"].toFixed(2)}` : "—",
              },
              {
                label: "Return 5 giorni",
                value: fmtPct(m["5DayPriceReturnDaily"]),
                color: ratingGrowth(m["5DayPriceReturnDaily"]),
              },
              {
                label: "Return 13 settimane",
                value: fmtPct(m["13WeekPriceReturnDaily"]),
                color: ratingGrowth(m["13WeekPriceReturnDaily"]),
              },
              {
                label: "Return 26 settimane",
                value: fmtPct(m["26WeekPriceReturnDaily"]),
                color: ratingGrowth(m["26WeekPriceReturnDaily"]),
              },
              {
                label: "Return 52 settimane",
                value: fmtPct(m["52WeekPriceReturnDaily"]),
                color: ratingGrowth(m["52WeekPriceReturnDaily"]),
              },
              {
                label: "Return YTD",
                value: fmtPct(m.yearToDatePriceReturnDaily),
                color: ratingGrowth(m.yearToDatePriceReturnDaily),
              },
              { label: "Beta", value: fmtVal(m.beta) },
            ],
          },
        ];

        let html = '<div class="snapshot-grid">';
        sezioni.forEach((s) => {
          html += `<div class="card"><div class="card-header">${s.titolo}</div><div class="card-body">`;
          s.righe.forEach((r) => {
            if (s.tipo === "bar" && r.value !== null && r.value !== undefined) {
              const pct = Math.min(Math.max(r.value, -100), 100);
              const fillWidth = Math.abs(pct);
              html += `
                <div class="bar-row">
                  <div class="bar-top">
                    <span class="bar-label">${r.label}</span>
                    <span class="bar-val" style="color:var(--${r.color || "text"})">${r.value.toFixed(1)}%</span>
                  </div>
                  <div class="bar-track">
                    <div class="bar-fill ${r.color || "blue"}" style="width:${fillWidth}%"></div>
                  </div>
                </div>`;
            } else {
              const colorClass = r.color ? ` ${r.color}` : "";
              html += `
                <div class="metric-row">
                  <span class="metric-label">${r.label}</span>
                  <span class="metric-value${colorClass}">${r.value ?? "—"}</span>
                </div>`;
            }
          });
          html += `</div></div>`;
        });
        html += "</div>";

        container.innerHTML = html;
      }

      // ─── Formattatori ─────────────────────────────────────
      function fmtVal(v) {
        return v !== null && v !== undefined ? parseFloat(v).toFixed(2) : "—";
      }
      function fmtPct(v) {
        if (v === null || v === undefined) return "—";
        return (v >= 0 ? "+" : "") + parseFloat(v).toFixed(2) + "%";
      }
      function formatBig(v) {
        if (!v) return "—";
        if (v >= 1e12) return "$" + (v / 1e12).toFixed(2) + "T";
        if (v >= 1e9) return "$" + (v / 1e9).toFixed(2) + "B";
        if (v >= 1e6) return "$" + (v / 1e6).toFixed(2) + "M";
        return "$" + v.toLocaleString();
      }

      // ─── Rating colori ────────────────────────────────────
      function ratingPE(v) {
        if (!v) return "neutral";
        if (v < 0) return "neg";
        if (v < 20) return "pos";
        if (v < 35) return "neutral";
        return "neg";
      }
      function ratingGrowth(v) {
        if (!v) return "neutral";
        if (v > 10) return "pos";
        if (v > 0) return "neutral";
        return "neg";
      }
      function ratingMargin(v) {
        if (!v) return "neutral";
        if (v > 20) return "green";
        if (v > 10) return "yellow";
        if (v > 0) return "yellow";
        return "red";
      }
      function ratingROE(v) {
        if (!v) return "neutral";
        if (v > 15) return "green";
        if (v > 5) return "yellow";
        return "red";
      }
      function ratingLiquidity(v) {
        if (!v) return "neutral";
        if (v >= 2) return "pos";
        if (v >= 1) return "neutral";
        return "neg";
      }
      function ratingDebt(v) {
        if (!v) return "neutral";
        if (v < 50) return "pos";
        if (v < 100) return "neutral";
        return "neg";
      }

      function setStatus(tipo, testo) {
        document.getElementById("status-dot").className = "dot " + tipo;
        document.getElementById("status-text").textContent = testo;
      }
    </script>
  </body>
</html>
