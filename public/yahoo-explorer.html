<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Yahoo Explorer</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0e17;
        --surface: #111827;
        --surface2: #1a2235;
        --border: #1f2d45;
        --accent: #00d4ff;
        --green: #10b981;
        --red: #ef4444;
        --yellow: #f59e0b;
        --purple: #8b5cf6;
        --text: #e2e8f0;
        --text-dim: #64748b;
        --text-muted: #334155;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "IBM Plex Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      .page-content {
        max-width: 1400px;
        margin: 0 auto;
        padding: 32px 24px;
      }
      h1 {
        font-size: 32px;
        font-weight: 300;
        letter-spacing: -0.02em;
        margin-bottom: 4px;
      }
      h1 span {
        color: var(--accent);
        font-weight: 600;
      }
      .subtitle {
        color: var(--text-dim);
        font-size: 14px;
        margin-bottom: 32px;
        font-family: "IBM Plex Mono", monospace;
      }

      /* Search */
      .search-box {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 24px;
      }
      .search-box h3 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-dim);
        font-family: "IBM Plex Mono", monospace;
        margin-bottom: 14px;
      }
      .search-row {
        display: flex;
        gap: 12px;
        align-items: flex-end;
        flex-wrap: wrap;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
        min-width: 200px;
      }
      .field label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-dim);
        font-family: "IBM Plex Mono", monospace;
      }
      .field input {
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 10px 14px;
        border-radius: 6px;
        font-size: 14px;
        transition: border-color 0.2s;
        width: 100%;
      }
      .field input:focus {
        outline: none;
        border-color: var(--accent);
      }
      .field input::placeholder {
        color: var(--text-muted);
      }
      .btn {
        background: var(--accent);
        color: #000;
        border: none;
        padding: 10px 24px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        font-family: "IBM Plex Mono", monospace;
        transition: opacity 0.2s;
        white-space: nowrap;
      }
      .btn:hover {
        opacity: 0.85;
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .hint {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 8px;
        font-family: "IBM Plex Mono", monospace;
      }

      /* Suggestions */
      .suggestions {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 6px;
        margin-top: 6px;
        overflow: hidden;
        display: none;
      }
      .suggestions.visible {
        display: block;
      }
      .suggestion-item {
        padding: 10px 14px;
        cursor: pointer;
        border-bottom: 1px solid var(--border);
        transition: background 0.15s;
      }
      .suggestion-item:last-child {
        border-bottom: none;
      }
      .suggestion-item:hover {
        background: var(--surface);
      }
      .sug-ticker {
        font-family: "IBM Plex Mono", monospace;
        color: var(--accent);
        font-weight: 600;
        font-size: 13px;
      }
      .sug-name {
        font-size: 13px;
        color: var(--text);
        margin-left: 8px;
      }
      .sug-exchange {
        font-size: 11px;
        color: var(--text-dim);
        margin-left: 8px;
      }

      /* Status */
      .status-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 24px;
        font-size: 13px;
        color: var(--text-dim);
        font-family: "IBM Plex Mono", monospace;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--text-muted);
      }
      .dot.loading {
        background: var(--accent);
        animation: pulse 1s infinite;
      }
      .dot.ready {
        background: var(--green);
      }
      .dot.error {
        background: var(--red);
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      /* Company header */
      .company-header {
        display: none;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 20px 24px;
        margin-bottom: 24px;
      }
      .company-header.visible {
        display: flex;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
      }
      .ch-info {
        flex: 1;
      }
      .ch-name {
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .ch-ticker {
        font-family: "IBM Plex Mono", monospace;
        color: var(--accent);
        font-size: 14px;
      }
      .ch-meta {
        color: var(--text-dim);
        font-size: 13px;
        margin-top: 2px;
      }
      .ch-price-block {
        text-align: right;
      }
      .ch-price {
        font-size: 28px;
        font-weight: 600;
        font-family: "IBM Plex Mono", monospace;
      }
      .ch-change {
        font-size: 13px;
        font-family: "IBM Plex Mono", monospace;
        margin-top: 2px;
      }
      .ch-change.pos {
        color: var(--green);
      }
      .ch-change.neg {
        color: var(--red);
      }

      /* Tabs */
      .tabs {
        display: flex;
        gap: 2px;
        margin-bottom: 20px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 4px;
        width: fit-content;
      }
      .tab {
        padding: 8px 18px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-family: "IBM Plex Mono", monospace;
        color: var(--text-dim);
        transition: all 0.2s;
      }
      .tab:hover {
        color: var(--text);
      }
      .tab.active {
        background: var(--accent);
        color: #000;
        font-weight: 600;
      }

      /* Grid metriche */
      .metrics-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin-bottom: 24px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      .card-header {
        background: var(--surface2);
        padding: 12px 16px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-dim);
        font-family: "IBM Plex Mono", monospace;
        border-bottom: 1px solid var(--border);
      }
      .metric-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
      }
      .metric-row:last-child {
        border-bottom: none;
      }
      .metric-row:hover {
        background: var(--surface2);
      }
      .metric-label {
        font-size: 13px;
        color: var(--text-dim);
      }
      .metric-value {
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        font-weight: 600;
      }
      .pos {
        color: var(--green);
      }
      .neg {
        color: var(--red);
      }
      .neutral {
        color: var(--text-dim);
      }

      /* Tabella bilanci */
      .bilanci-wrap {
        overflow-x: auto;
      }
      .bilanci-toggle {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }
      .toggle-btn {
        padding: 6px 16px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-dim);
        font-size: 12px;
        font-family: "IBM Plex Mono", monospace;
        cursor: pointer;
        transition: all 0.2s;
      }
      .toggle-btn.active {
        border-color: var(--accent);
        color: var(--accent);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        min-width: 600px;
      }
      thead tr {
        background: var(--surface2);
        border-bottom: 2px solid var(--border);
      }
      th {
        padding: 10px 14px;
        text-align: right;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-dim);
        font-family: "IBM Plex Mono", monospace;
        white-space: nowrap;
      }
      th:first-child {
        text-align: left;
      }
      tbody tr {
        border-bottom: 1px solid var(--border);
      }
      tbody tr:hover {
        background: var(--surface2);
      }
      td {
        padding: 10px 14px;
        font-family: "IBM Plex Mono", monospace;
        text-align: right;
        white-space: nowrap;
      }
      td:first-child {
        text-align: left;
        color: var(--text-dim);
        font-family: "IBM Plex Sans", sans-serif;
        font-size: 13px;
      }
      .val-pos {
        color: var(--green);
      }
      .val-neg {
        color: var(--red);
      }

      .empty {
        padding: 60px;
        text-align: center;
        color: var(--text-muted);
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
      }
      .badge-avail {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
        background: rgba(16, 185, 129, 0.15);
        color: var(--green);
      }
      .badge-miss {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 11px;
        background: rgba(239, 68, 68, 0.15);
        color: var(--red);
      }
    </style>
  </head>
  <body>
    <script src="/navbar.js"></script>
    <div class="page-content">
      <h1>Yahoo <span>Explorer</span></h1>
      <p class="subtitle">
        // bilanci, metriche e dati fondamentali · mercati globali · fonte:
        Yahoo Finance
      </p>

      <div class="search-box">
        <h3>// Cerca azienda</h3>
        <div class="search-row">
          <div class="field">
            <label>Nome, Ticker o ISIN</label>
            <input
              type="text"
              id="input-query"
              placeholder="es. ENI, ENI.MI, Apple, AAPL, US0378331005..."
              autocomplete="off"
            />
            <div
              class="suggestions"
              id="suggestions"
            ></div>
            <p class="hint">
              Mercati: USA → AAPL · Italia → ENI.MI · Germania → VOW3.DE ·
              Francia → AIR.PA · UK → SHEL.L
            </p>
          </div>
          <button
            class="btn"
            id="btn-cerca"
            onclick="cerca()"
          >
            CERCA
          </button>
        </div>
      </div>

      <div class="status-bar">
        <div
          class="dot"
          id="status-dot"
        ></div>
        <span id="status-text">Inserisci un ticker o nome azienda</span>
      </div>

      <div
        class="company-header"
        id="company-header"
      >
        <div class="ch-info">
          <div
            class="ch-name"
            id="ch-name"
          ></div>
          <div>
            <span
              class="ch-ticker"
              id="ch-ticker"
            ></span>
            <span
              class="ch-meta"
              id="ch-meta"
            ></span>
          </div>
        </div>
        <div class="ch-price-block">
          <div
            class="ch-price"
            id="ch-price"
          ></div>
          <div
            class="ch-change"
            id="ch-change"
          ></div>
        </div>
      </div>

      <div id="main-content"></div>
    </div>

    <script>
      let searchTimeout;
      let tickerCorrente = null;
      let tabCorrente = "panoramica";
      let datiQuote = null;
      let datiSummary = null;

      // ─── Ricerca con autocomplete ─────────────────────────
      document
        .getElementById("input-query")
        .addEventListener("input", function () {
          clearTimeout(searchTimeout);
          const q = this.value.trim();
          if (q.length < 2) {
            hideSuggestions();
            return;
          }
          searchTimeout = setTimeout(() => autocomplete(q), 400);
        });

      document
        .getElementById("input-query")
        .addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            hideSuggestions();
            cerca();
          }
          if (e.key === "Escape") hideSuggestions();
        });

      async function autocomplete(q) {
        try {
          const res = await fetch(
            `/api/yahoo/search?q=${encodeURIComponent(q)}`,
          );
          const data = await res.json();
          const quotes = (data.quotes || []).slice(0, 6);
          if (!quotes.length) {
            hideSuggestions();
            return;
          }

          const box = document.getElementById("suggestions");
          box.innerHTML = quotes
            .map(
              (s) => `
          <div class="suggestion-item" onclick="seleziona('${s.symbol}', '${(s.longname || s.shortname || "").replace(/'/g, "\\'")}')">
            <span class="sug-ticker">${s.symbol}</span>
            <span class="sug-name">${s.longname || s.shortname || ""}</span>
            <span class="sug-exchange">${s.exchDisp || s.exchange || ""}</span>
          </div>`,
            )
            .join("");
          box.className = "suggestions visible";
        } catch (e) {
          hideSuggestions();
        }
      }

      function seleziona(ticker, nome) {
        document.getElementById("input-query").value = ticker;
        hideSuggestions();
        cerca(ticker);
      }

      function hideSuggestions() {
        document.getElementById("suggestions").className = "suggestions";
      }

      // ─── Carica dati azienda ──────────────────────────────
      async function cerca(tickerForzato) {
        const query =
          tickerForzato ||
          document.getElementById("input-query").value.trim().toUpperCase();
        if (!query) return;

        hideSuggestions();
        setStatus("loading", `Carico dati per ${query}...`);
        document.getElementById("btn-cerca").disabled = true;
        document.getElementById("company-header").className = "company-header";
        document.getElementById("main-content").innerHTML = "";

        try {
          const [quoteRes, summaryRes] = await Promise.all([
            fetch(`/api/yahoo/quote/${query}`),
            fetch(`/api/yahoo/summary/${query}`),
          ]);

          datiQuote = await quoteRes.json();
          datiSummary = await summaryRes.json();

          if (datiQuote.error) throw new Error(datiQuote.error);

          tickerCorrente = query;

          // Header
          document.getElementById("ch-name").textContent =
            datiQuote.longName || datiQuote.shortName || query;
          document.getElementById("ch-ticker").textContent =
            datiQuote.symbol || query;
          document.getElementById("ch-meta").textContent = [
            datiQuote.sector,
            datiQuote.industry,
            datiQuote.fullExchangeName,
          ]
            .filter(Boolean)
            .map((s) => ` · ${s}`)
            .join("");

          const prezzo = datiQuote.regularMarketPrice;
          const currency = datiQuote.currency || "";
          document.getElementById("ch-price").textContent = prezzo
            ? `${currency} ${prezzo.toFixed(2)}`
            : "—";

          const change = datiQuote.regularMarketChangePercent;
          if (change !== undefined) {
            const el = document.getElementById("ch-change");
            el.textContent = `${change >= 0 ? "▲" : "▼"} ${Math.abs(change).toFixed(2)}% oggi`;
            el.className = `ch-change ${change >= 0 ? "pos" : "neg"}`;
          }

          document.getElementById("company-header").className =
            "company-header visible";

          renderTabs();
          renderTab("panoramica");
          setStatus("ready", `Dati caricati · ${datiQuote.longName || query}`);
        } catch (err) {
          setStatus("error", "Errore: " + err.message);
          document.getElementById("main-content").innerHTML =
            `<div class="empty">Ticker non trovato o errore nel caricamento.<br><br>Prova con il formato corretto: ENI.MI, AIR.PA, VOW3.DE</div>`;
        }

        document.getElementById("btn-cerca").disabled = false;
      }

      // ─── Tabs ─────────────────────────────────────────────
      function renderTabs() {
        document.getElementById("main-content").innerHTML = `
        <div class="tabs">
          <div class="tab active" onclick="renderTab('panoramica')" id="tab-panoramica">Panoramica</div>
          <div class="tab" onclick="renderTab('income')" id="tab-income">Income Statement</div>
          <div class="tab" onclick="renderTab('balance')" id="tab-balance">Balance Sheet</div>
          <div class="tab" onclick="renderTab('cashflow')" id="tab-cashflow">Cash Flow</div>
        </div>
        <div id="tab-content"></div>`;
      }

      function renderTab(nome) {
        tabCorrente = nome;
        ["panoramica", "income", "balance", "cashflow"].forEach((t) => {
          const el = document.getElementById(`tab-${t}`);
          if (el) el.className = "tab" + (t === nome ? " active" : "");
        });

        const content = document.getElementById("tab-content");
        if (!content) return;

        if (nome === "panoramica") renderPanoramica(content);
        else renderBilancio(content, nome);
      }

      // ─── Tab Panoramica ───────────────────────────────────
      function renderPanoramica(container) {
        const q = datiQuote;
        const s = datiSummary;
        const fs = s?.financialData || {};
        const ks = s?.defaultKeyStatistics || {};
        const si = s?.summaryDetail || {};

        // Disponibilità dati
        const incomeA = s?.incomeStatementHistory?.incomeStatementHistory || [];
        const balanceA = s?.balanceSheetHistory?.balanceSheetStatements || [];
        const cashA = s?.cashflowStatementHistory?.cashflowStatements || [];
        const incomeQ =
          s?.incomeStatementHistoryQuarterly?.incomeStatementHistory || [];
        const balanceQ =
          s?.balanceSheetHistoryQuarterly?.balanceSheetStatements || [];
        const cashQ =
          s?.cashflowStatementHistoryQuarterly?.cashflowStatements || [];

        const hasIncome = !!incomeA.length;
        const hasBalance = !!balanceA.length;
        const hasCashflow = !!cashA.length;
        const hasIncomeQ = !!incomeQ.length;
        const hasBalanceQ = !!balanceQ.length;
        const hasCashflowQ = !!cashQ.length;

        // Formatta data ultimo periodo disponibile
        function ultimoPeriodo(arr, quarterly) {
          if (!arr.length) return null;
          const d = new Date(arr[0].endDate);
          return quarterly
            ? `Q${Math.ceil((d.getMonth() + 1) / 3)} ${d.getFullYear()}`
            : `FY${d.getFullYear()}`;
        }

        const badge = (ok, ultimo) =>
          ok
            ? `<span class="badge-avail">✓ Aggiornato a ${ultimo}</span>`
            : `<span class="badge-miss">✗ Non disponibile</span>`;

        container.innerHTML = `
        <div class="metrics-grid">

          <div class="card">
            <div class="card-header">// Disponibilità dati</div>
            ${metricRow("Income Statement (annuale)", badge(hasIncome, ultimoPeriodo(incomeA, false)))}
            ${metricRow("Balance Sheet (annuale)", badge(hasBalance, ultimoPeriodo(balanceA, false)))}
            ${metricRow("Cash Flow (annuale)", badge(hasCashflow, ultimoPeriodo(cashA, false)))}
            ${metricRow("Income Statement (trimestrale)", badge(hasIncomeQ, ultimoPeriodo(incomeQ, true)))}
            ${metricRow("Balance Sheet (trimestrale)", badge(hasBalanceQ, ultimoPeriodo(balanceQ, true)))}
            ${metricRow("Cash Flow (trimestrale)", badge(hasCashflowQ, ultimoPeriodo(cashQ, true)))}
          </div>

          <div class="card">
            <div class="card-header">// Valutazione di mercato</div>
            ${metricRow("Market Cap", formatBig(q.marketCap))}
            ${metricRow("Enterprise Value", formatBig(ks.enterpriseValue))}
            ${metricRow("P/E (TTM)", fmtVal(q.trailingPE))}
            ${metricRow("P/E (Forward)", fmtVal(q.forwardPE))}
            ${metricRow("P/S (TTM)", fmtVal(ks.priceToSalesTrailing12Months))}
            ${metricRow("P/B", fmtVal(q.priceToBook))}
            ${metricRow("EV/EBITDA", fmtVal(ks.enterpriseToEbitda))}
            ${metricRow("EV/Revenue", fmtVal(ks.enterpriseToRevenue))}
          </div>

          <div class="card">
            <div class="card-header">// Redditività</div>
            ${metricRow("Revenue (TTM)", formatBig(fs.totalRevenue))}
            ${metricRow("Gross Margin", fmtPct(fs.grossMargins))}
            ${metricRow("Operating Margin", fmtPct(fs.operatingMargins))}
            ${metricRow("Profit Margin", fmtPct(fs.profitMargins))}
            ${metricRow("ROE", fmtPct(fs.returnOnEquity))}
            ${metricRow("ROA", fmtPct(fs.returnOnAssets))}
            ${metricRow("EBITDA", formatBig(fs.ebitda))}
          </div>

          <div class="card">
            <div class="card-header">// Per azione</div>
            ${metricRow("EPS (TTM)", fmtVal(q.epsTrailingTwelveMonths))}
            ${metricRow("EPS (Forward)", fmtVal(q.epsForward))}
            ${metricRow("Book Value/Share", fmtVal(ks.bookValue))}
            ${metricRow("Revenue/Share (TTM)", fmtVal(fs.revenuePerShare))}
            ${metricRow("FCF/Share", fmtVal(fs.freeCashflow && q.sharesOutstanding ? fs.freeCashflow.raw / q.sharesOutstanding : null))}
            ${metricRow("Dividendo/Share", fmtVal(si.dividendRate))}
            ${metricRow("Dividend Yield", fmtPct(si.dividendYield))}
          </div>

          <div class="card">
            <div class="card-header">// Solidità finanziaria</div>
            ${metricRow("Cash totale", formatBig(fs.totalCash))}
            ${metricRow("Cash/Share", fmtVal(fs.totalCashPerShare))}
            ${metricRow("Debito totale", formatBig(fs.totalDebt))}
            ${metricRow("Debt/Equity", fmtVal(fs.debtToEquity))}
            ${metricRow("Current Ratio", fmtVal(fs.currentRatio))}
            ${metricRow("Quick Ratio", fmtVal(fs.quickRatio))}
          </div>

          <div class="card">
            <div class="card-header">// Crescita</div>
            ${metricRow("Revenue Growth (YoY)", fmtPct(fs.revenueGrowth))}
            ${metricRow("Earnings Growth (YoY)", fmtPct(fs.earningsGrowth))}
            ${metricRow("EPS Growth (YoY)", fmtPct(ks.earningsQuarterlyGrowth))}
            ${metricRow("Azioni in circolazione", formatNum(q.sharesOutstanding))}
            ${metricRow("Float", formatNum(q.floatShares))}
            ${metricRow("Short %", fmtPct(ks.shortPercentOfFloat))}
          </div>

        </div>`;
      }

      // ─── Tab Bilanci ──────────────────────────────────────
      function renderBilancio(container, tipo) {
        const s = datiSummary;
        let annual, quarterly;

        if (tipo === "income") {
          annual = s?.incomeStatementHistory?.incomeStatementHistory || [];
          quarterly =
            s?.incomeStatementHistoryQuarterly?.incomeStatementHistory || [];
        } else if (tipo === "balance") {
          annual = s?.balanceSheetHistory?.balanceSheetStatements || [];
          quarterly =
            s?.balanceSheetHistoryQuarterly?.balanceSheetStatements || [];
        } else {
          annual = s?.cashflowStatementHistory?.cashflowStatements || [];
          quarterly =
            s?.cashflowStatementHistoryQuarterly?.cashflowStatements || [];
        }

        container.innerHTML = `
        <div class="bilanci-toggle">
          <button class="toggle-btn active" id="toggle-annual" onclick="switchToggle('annual')">Annuale</button>
          <button class="toggle-btn" id="toggle-quarterly" onclick="switchToggle('quarterly')">Trimestrale</button>
        </div>
        <div id="bilancio-table"></div>`;

        renderBilancioTable(annual, tipo, "annual");

        container._annual = annual;
        container._quarterly = quarterly;
        container._tipo = tipo;
      }

      function switchToggle(mode) {
        const container = document.getElementById("tab-content");
        document.getElementById("toggle-annual").className =
          "toggle-btn" + (mode === "annual" ? " active" : "");
        document.getElementById("toggle-quarterly").className =
          "toggle-btn" + (mode === "quarterly" ? " active" : "");
        const data =
          mode === "annual" ? container._annual : container._quarterly;
        renderBilancioTable(data, container._tipo, mode);
      }

      function renderBilancioTable(statements, tipo, mode) {
        const tableEl = document.getElementById("bilancio-table");
        if (!statements || !statements.length) {
          tableEl.innerHTML = `<div class="empty">Dati ${mode === "annual" ? "annuali" : "trimestrali"} non disponibili per questa azienda</div>`;
          return;
        }

        const righe = getRighe(tipo);
        const dates = statements.map((s) => {
          const d = new Date(s.endDate);
          return mode === "annual"
            ? `FY${d.getFullYear()}`
            : `Q${Math.ceil((d.getMonth() + 1) / 3)} ${d.getFullYear()}`;
        });

        let html = `<div class="bilanci-wrap"><table><thead><tr>
        <th>Voce</th>
        ${dates.map((d) => `<th>${d}</th>`).join("")}
      </tr></thead><tbody>`;

        righe.forEach((riga) => {
          if (riga.separator) {
            html += `<tr style="background:var(--surface2)"><td colspan="${dates.length + 1}" style="font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);padding:8px 14px;">${riga.label}</td></tr>`;
            return;
          }
          html += `<tr><td>${riga.label}</td>`;
          statements.forEach((s) => {
            const val = s[riga.key];
            const fmt =
              val !== undefined && val !== null ? formatBig(val) : "—";
            const cls =
              riga.colorize && val !== undefined && val !== null
                ? val >= 0
                  ? "val-pos"
                  : "val-neg"
                : "";
            html += `<td class="${cls}">${fmt}</td>`;
          });
          html += `</tr>`;
        });

        html += `</tbody></table></div>`;
        tableEl.innerHTML = html;
      }

      function getRighe(tipo) {
        if (tipo === "income")
          return [
            { separator: true, label: "Ricavi" },
            { key: "totalRevenue", label: "Ricavi totali" },
            { key: "costOfRevenue", label: "Costo del venduto" },
            { key: "grossProfit", label: "Utile lordo", colorize: true },
            { separator: true, label: "Costi operativi" },
            { key: "researchDevelopment", label: "R&D" },
            { key: "sellingGeneralAdministrative", label: "SG&A" },
            { key: "totalOperatingExpenses", label: "Costi operativi totali" },
            {
              key: "operatingIncome",
              label: "Reddito operativo (EBIT)",
              colorize: true,
            },
            { separator: true, label: "Risultato finale" },
            { key: "ebit", label: "EBIT" },
            { key: "interestExpense", label: "Interessi passivi" },
            {
              key: "incomeBeforeTax",
              label: "Reddito pre-tasse",
              colorize: true,
            },
            { key: "incomeTaxExpense", label: "Imposte" },
            { key: "netIncome", label: "Utile netto", colorize: true },
            {
              key: "netIncomeApplicableToCommonShares",
              label: "Utile per azionisti",
              colorize: true,
            },
          ];
        if (tipo === "balance")
          return [
            { separator: true, label: "Attivo corrente" },
            { key: "cash", label: "Cash e equivalenti" },
            {
              key: "shortTermInvestments",
              label: "Investimenti breve termine",
            },
            { key: "netReceivables", label: "Crediti" },
            { key: "inventory", label: "Inventario" },
            { key: "totalCurrentAssets", label: "Totale attivo corrente" },
            { separator: true, label: "Attivo non corrente" },
            { key: "longTermInvestments", label: "Investimenti lungo termine" },
            {
              key: "propertyPlantEquipment",
              label: "Immobili e impianti (netto)",
            },
            { key: "goodWill", label: "Goodwill" },
            { key: "intangibleAssets", label: "Attivi immateriali" },
            { key: "totalAssets", label: "Totale attivo" },
            { separator: true, label: "Passivo" },
            { key: "accountsPayable", label: "Debiti commerciali" },
            {
              key: "shortLongTermDebt",
              label: "Debiti finanziari breve termine",
            },
            {
              key: "totalCurrentLiabilities",
              label: "Totale passivo corrente",
            },
            { key: "longTermDebt", label: "Debiti lungo termine" },
            { key: "totalLiab", label: "Totale passivo" },
            { separator: true, label: "Patrimonio netto" },
            { key: "retainedEarnings", label: "Utili trattenuti" },
            { key: "totalStockholderEquity", label: "Patrimonio netto totale" },
          ];
        return [
          // cashflow
          { separator: true, label: "Operativo" },
          { key: "netIncome", label: "Utile netto" },
          { key: "depreciation", label: "Ammortamenti" },
          { key: "changeToNetincome", label: "Variazioni non monetarie" },
          {
            key: "totalCashFromOperatingActivities",
            label: "Cash flow operativo",
            colorize: true,
          },
          { separator: true, label: "Investimenti" },
          { key: "capitalExpenditures", label: "Capex" },
          { key: "investments", label: "Investimenti" },
          {
            key: "totalCashflowsFromInvestingActivities",
            label: "Cash flow investimenti",
            colorize: true,
          },
          { separator: true, label: "Finanziario" },
          { key: "dividendsPaid", label: "Dividendi pagati" },
          { key: "repurchaseOfStock", label: "Buyback azioni" },
          { key: "issuanceOfStock", label: "Emissione azioni" },
          { key: "netBorrowings", label: "Variazione debiti" },
          {
            key: "totalCashFromFinancingActivities",
            label: "Cash flow finanziario",
            colorize: true,
          },
          { separator: true, label: "Sintesi" },
          {
            key: "changeInCash",
            label: "Variazione netta cash",
            colorize: true,
          },
          { key: "freeCashFlow", label: "Free Cash Flow", colorize: true },
        ];
      }

      // ─── Formattatori ─────────────────────────────────────
      function fmtVal(v) {
        return v !== null && v !== undefined ? parseFloat(v).toFixed(2) : "—";
      }
      function fmtPct(v) {
        if (v === null || v === undefined) return "—";
        return (v * 100 >= 0 ? "+" : "") + (v * 100).toFixed(2) + "%";
      }
      function formatBig(v) {
        if (v === null || v === undefined) return "—";
        const abs = Math.abs(v);
        const sign = v < 0 ? "-" : "";
        if (abs >= 1e12) return sign + "$" + (abs / 1e12).toFixed(2) + "T";
        if (abs >= 1e9) return sign + "$" + (abs / 1e9).toFixed(2) + "B";
        if (abs >= 1e6) return sign + "$" + (abs / 1e6).toFixed(2) + "M";
        if (abs >= 1e3) return sign + "$" + (abs / 1e3).toFixed(1) + "K";
        return sign + "$" + v.toLocaleString();
      }
      function formatNum(v) {
        if (!v) return "—";
        if (v >= 1e9) return (v / 1e9).toFixed(2) + "B";
        if (v >= 1e6) return (v / 1e6).toFixed(2) + "M";
        return v.toLocaleString();
      }
      function metricRow(label, value) {
        return `<div class="metric-row"><span class="metric-label">${label}</span><span class="metric-value">${value}</span></div>`;
      }
      function setStatus(tipo, testo) {
        document.getElementById("status-dot").className = "dot " + tipo;
        document.getElementById("status-text").textContent = testo;
      }

      // Chiudi suggestions cliccando fuori
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".field")) hideSuggestions();
      });
    </script>
  </body>
</html>
